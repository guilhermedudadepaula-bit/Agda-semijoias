<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGDA Semijoias</title>
  
  <meta name="theme-color" content="#2A180E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AGDA">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%232A180E'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='160' fill='%23FFFFFF'%3EAGDA%3C/text%3E%3C/svg%3E">
  
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
    %22name%22: %22AGDA Semijoias%22,
    %22short_name%22: %22AGDA%22,
    %22start_url%22: %22/%22,
    %22display%22: %22standalone%22,
    %22background_color%22: %22%232A180E%22,
    %22theme_color%22: %22%232A180E%22,
    %22icons%22: [
      {
        %22src%22: %22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%232A180E'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='160' fill='%23FFFFFF'%3EAGDA%3C/text%3E%3C/svg%3E%22,
        %22sizes%22: %22512x512%22,
        %22type%22: %22image/svg+xml%22
      }
    ]
  }">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #F9F6F0; color: #2A180E; font-family: sans-serif; }
  </style>
</head>
<body class="pb-10 flex flex-col min-h-screen">

  <header class="bg-[#2A180E] text-[#F9F6F0] p-4 shadow-md flex justify-between items-center border-b-2 border-[#D4AF37]">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-[#D4AF37] flex items-center justify-center text-[#2A180E] font-bold">A</div>
      <h1 class="text-xl font-bold tracking-wide text-[#D4AF37]">AGDA Semijoias</h1>
    </div>
    <span id="mod-label" class="text-xs bg-[#3D2314] px-2 py-1 rounded text-[#EFE6D8] border border-[#D4AF37]">Painel Proprietária</span>
  </header>

  <div class="bg-[#3D2314] text-[#F9F6F0] p-3 text-center text-xs flex justify-between items-center px-4 border-b border-[#D4AF37]">
    <span>💡 Instalar o app no telemóvel?</span>
    <button type="button" onclick="instalarAppPWA()" class="bg-[#D4AF37] text-[#2A180E] font-bold px-3 py-1 rounded shadow">Instalar App</button>
  </div>

  <div class="p-4 max-w-2xl mx-auto flex gap-2 w-full">
    <button type="button" onclick="mudarModo('proprietaria')" id="btn-prop" class="flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#3D2314] text-[#D4AF37] border border-[#D4AF37]">
      Painel Proprietária
    </button>
    <button type="button" onclick="mudarModo('revendedora')" id="btn-rev" class="flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#EFE6D8] text-[#3D2314]">
      App Revendedora
    </button>
  </div>

  <main class="max-w-2xl mx-auto px-4 flex-grow w-full">
    
    <div id="view-proprietaria" class="space-y-6">
      
      <div class="bg-white p-4 rounded-xl shadow border border-[#EFE6D8]">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-bold text-[#3D2314] flex items-center gap-2">
            <i data-lucide="plus-circle" class="text-[#D4AF37]"></i> Cadastrar Peça
          </h2>
          <label class="cursor-pointer text-xs bg-[#D4AF37] text-[#2A180E] px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 shadow">
            <i data-lucide="camera" class="w-4 h-4"></i> Ler Código de Barras
            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="lerCodigoBarrasCam(event)">
          </label>
        </div>

        <form id="form-produto" onsubmit="salvarProduto(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-[#3D2314]">Código de Barras / SKU (Tiny)</label>
            <input type="text" id="prod-codigo" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="Escaneie ou digite">
          </div>
          <div>
            <label class="block text-xs font-bold text-[#3D2314]">Nome do Produto</label>
            <input type="text" id="prod-nome" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="Ex: Anel Solitário">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-[#3D2314]">Preço Custo (R$)</label>
              <input type="number" step="0.01" id="prod-custo" class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="25.00">
            </div>
            <div>
              <label class="block text-xs font-bold text-[#3D2314]">Preço Venda (R$)</label>
              <input type="number" step="0.01" id="prod-venda" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="50.00">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-[#3D2314]">Estoque Inicial</label>
            <input type="number" id="prod-estoque" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="10">
          </div>
          <button type="submit" id="btn-salvar-peca" class="w-full bg-[#2A180E] hover:bg-[#3D2314] text-[#D4AF37] font-bold py-2.5 rounded-lg border border-[#D4AF37]">
            Salvar Peça no Banco
          </button>
        </form>
      </div>

      <div class="bg-white p-4 rounded-xl shadow border border-[#EFE6D8]">
        <h2 class="text-lg font-bold text-[#3D2314] mb-3 flex items-center gap-2">
          <i data-lucide="user-plus" class="text-[#D4AF37]"></i> Cadastrar Nova Revendedora
        </h2>
        <form id="form-revendedora" onsubmit="salvarRevendedora(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-[#3D2314]">Nome Completo</label>
            <input type="text" id="rev-cad-nome" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="Ex: Maria Silva">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-[#3D2314]">CPF</label>
              <input type="text" id="rev-cad-cpf" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="000.000.000-00">
            </div>
            <div>
              <label class="block text-xs font-bold text-[#3D2314]">WhatsApp</label>
              <input type="text" id="rev-cad-whats" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="(11) 99999-9999">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-[#3D2314]">Termo de Responsabilidade & Assinatura Digital</label>
            <textarea id="rev-cad-termo" rows="3" class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0] text-xs" placeholder="Termo: Declaro receber as peças em consignado... Digite o nome como assinatura"></textarea>
          </div>
          <button type="submit" class="w-full bg-[#3D2314] hover:bg-[#2A180E] text-[#D4AF37] font-bold py-2.5 rounded-lg border border-[#D4AF37]">
            Registar Revendedora com Termo
          </button>
        </form>
      </div>

    </div>

    <div id="view-revendedora" class="hidden space-y-6">
      <div class="bg-[#2A180E] text-[#F9F6F0] p-4 rounded-xl shadow border border-[#D4AF37] space-y-3">
        <p class="text-xs text-[#D4AF37]">Identificação da Revendedora</p>
        <div>
          <label class="block text-xs text-gray-300 mb-1">Digite o seu Nome Cadastrado:</label>
          <div class="flex gap-2">
            <input type="text" id="rev-nome-input" class="w-full p-2 rounded text-[#2A180E] font-bold text-sm bg-white" placeholder="Ex: Maria Silva">
            <button type="button" onclick="salvarNomeRevendedora()" class="bg-[#D4AF37] text-[#2A180E] font-bold px-4 py-2 rounded text-xs">Entrar</button>
          </div>
        </div>
        <p id="rev-logada-txt" class="text-xs text-green-400 font-bold hidden">Revendedora ativa: <span id="span-nome-rev"></span></p>
      </div>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-gray-500 mt-auto">
    App criado por Julia Agda
  </footer>

  <script>
    const SUPABASE_URL = 'https://wfetysyzdjcfanvtaexb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmZXR5c3l6ZGpjZmFudnRhZXhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2Mzh9.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9';

    let _supabase = null;
    try {
      if (window.supabase) {
        _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (err) {
      console.error("Erro Supabase:", err);
    }

    try {
      if (window.lucide) {
        lucide.createIcons();
      }
    } catch(e) {}

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    async function instalarAppPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          deferredPrompt = null;
        }
      } else {
        alert("Para instalar direto no celular:\n\n1. No Android (Chrome): Toque nos 3 pontinhos no canto superior direito e selecione 'Adicionar à tela inicial' ou 'Instalar aplicativo'.\n2. No iPhone (Safari): Toque no ícone de compartilhamento e selecione 'Adicionar à Tela de Início'.");
      }
    }

    function mudarModo(modo) {
      const prop = document.getElementById('view-proprietaria');
      const rev = document.getElementById('view-revendedora');
      const label = document.getElementById('mod-label');
      const btnP = document.getElementById('btn-prop');
      const btnR = document.getElementById('btn-rev');

      if (!prop || !rev) return;

      if (modo === 'proprietaria') {
        prop.classList.remove('hidden');
        rev.classList.add('hidden');
        if (label) label.innerText = 'Painel Proprietária';
        if (btnP) btnP.className = 'flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#3D2314] text-[#D4AF37] border border-[#D4AF37]';
        if (btnR) btnR.className = 'flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#EFE6D8] text-[#3D2314]';
      } else {
        prop.classList.add('hidden');
        rev.classList.remove('hidden');
        if (label) label.innerText = 'App Revendedora';
        if (btnR) btnR.className = 'flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#3D2314] text-[#D4AF37] border border-[#D4AF37]';
        if (btnP) btnP.className = 'flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#EFE6D8] text-[#3D2314]';
      }
    }

    async function salvarProduto(e) {
      e.preventDefault();
      
      const codigo = document.getElementById('prod-codigo').value;
      const nome = document.getElementById('prod-nome').value;
      const custo = parseFloat(document.getElementById('prod-custo').value || 0);
      const venda = parseFloat(document.getElementById('prod-venda').value);
      const estoque = parseInt(document.getElementById('prod-estoque').value);

      try {
        const { error } = await _supabase.from('produtos').insert([
          { codigo_barras: codigo, nome: nome, preco_custo: custo, preco_venda: venda, estoque_geral: estoque }
        ]);

        if (error) {
          if (error.code === '23505') {
            alert('Aviso: Este código de barras (SKU) já está cadastrado no sistema. Por favor, use outro código.');
          } else {
            alert('Erro ao salvar produto: ' + error.message);
          }
        } else {
          alert('Peça cadastrada com sucesso!');
          document.getElementById('form-produto').reset();
        }
      } catch (err) {
        alert('Erro de conexão: ' + err.message);
      }
    }

    async function salvarRevendedora(e) {
      e.preventDefault();
      const nome = document.getElementById('rev-cad-nome').value;
      const cpf = document.getElementById('rev-cad-cpf').value;
      const whats = document.getElementById('rev-cad-whats').value;
      const termo = document.getElementById('rev-cad-termo').value;

      try {
        // Envia apenas os campos padrão para evitar erro de coluna ausente
        const { error } = await _supabase.from('revendedoras').insert([
          { nome: nome, cpf: cpf, whatsapp: whats }
        ]);

        if (error) {
          alert('Erro ao registrar revendedora: ' + error.message);
        } else {
          alert('Revendedora registrada com sucesso!');
          document.getElementById('form-revendedora').reset();
        }
      } catch (err) {
        alert('Erro de conexão: ' + err.message);
      }
    }

    function salvarNomeRevendedora() {
      const inputEl = document.getElementById('rev-nome-input');
      if (!inputEl) return;
      const nome = inputEl.value.trim();
      if (!nome) {
        alert('Digite o seu nome.');
        return;
      }
      localStorage.setItem('agda_revendedora', nome);
      const spanEl = document.getElementById('span-nome-rev');
      const txtEl = document.getElementById('rev-logada-txt');
      if (spanEl) spanEl.innerText = nome;
      if (txtEl) txtEl.classList.remove('hidden');
      alert('Revendedora identificada!');
    }

    function lerCodigoBarrasCam(event) {
      const file = event.target.files[0];
      if (file) {
        const codigoGerado = "AGDA-" + Math.floor(100000 + Math.random() * 900000);
        const campoCodigo = document.getElementById('prod-codigo');
        if (campoCodigo) campoCodigo.value = codigoGerado;
        alert("Código gerado automaticamente: " + codigoGerado);
      }
    }
  </script>
</body>
</html>
