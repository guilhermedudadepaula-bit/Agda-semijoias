<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGDA Semijoias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #F9F6F0; color: #2A180E; font-family: sans-serif; }
  </style>
</head>
<body class="pb-10">

  <!-- Header -->
  <header class="bg-[#2A180E] text-[#F9F6F0] p-4 shadow-md flex justify-between items-center border-b-2 border-[#D4AF37]">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-[#D4AF37] flex items-center justify-center text-[#2A180E] font-bold">A</div>
      <h1 class="text-xl font-bold tracking-wide text-[#D4AF37]">AGDA Semijoias</h1>
    </div>
    <span id="mod-label" class="text-xs bg-[#3D2314] px-2 py-1 rounded text-[#EFE6D8] border border-[#D4AF37]">Painel Proprietária</span>
  </header>

  <!-- Navegação de Módulos -->
  <div class="p-4 max-w-2xl mx-auto flex gap-2">
    <button onclick="mudarModo('proprietaria')" id="btn-prop" class="flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#3D2314] text-[#D4AF37] border border-[#D4AF37]">
      Painel Proprietária
    </button>
    <button onclick="mudarModo('revendedora')" id="btn-rev" class="flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#EFE6D8] text-[#3D2314]">
      App Revendedora
    </button>
  </div>

  <main class="max-w-2xl mx-auto px-4">
    
    <!-- MÓDULO PROPRIETÁRIA -->
    <div id="view-proprietaria" class="space-y-6">
      
      <!-- Formulário Novo Produto + Câmara Nativa -->
      <div class="bg-white p-4 rounded-xl shadow border border-[#EFE6D8]">
        <h2 class="text-lg font-bold text-[#3D2314] mb-3 flex items-center justify-between">
          <span class="flex items-center gap-2">
            <i data-lucide="plus-circle" class="text-[#D4AF37]"></i> Cadastrar Peça
          </span>
          <label class="cursor-pointer text-xs bg-[#D4AF37] text-[#2A180E] px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 shadow">
            <i data-lucide="camera" class="w-4 h-4"></i> Abrir Câmara
            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="lerCodigoComCamera(event)">
          </label>
        </h2>

        <form id="form-produto" onsubmit="salvarProduto(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-[#3D2314]">Código de Barras / SKU (Tiny)</label>
            <input type="text" id="prod-codigo" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="Escaneie ou digite o código">
          </div>
          <div>
            <label class="block text-xs font-bold text-[#3D2314]">Nome do Produto</label>
            <input type="text" id="prod-nome" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="Ex: Anel Solitário">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-[#3D2314]">Preço de Custo (R$)</label>
              <input type="number" step="0.01" id="prod-custo" class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="25.00">
            </div>
            <div>
              <label class="block text-xs font-bold text-[#3D2314]">Preço de Venda (R$)</label>
              <input type="number" step="0.01" id="prod-venda" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="50.00">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-[#3D2314]">Estoque Geral Inicial</label>
            <input type="number" id="prod-estoque" required class="w-full p-2 border rounded border-[#EFE6D8] bg-[#F9F6F0]" placeholder="10">
          </div>
          <button type="submit" id="btn-salvar" class="w-full bg-[#2A180E] hover:bg-[#3D2314] text-[#D4AF37] font-bold py-2.5 rounded-lg border border-[#D4AF37]">
            Salvar no Banco de Dados
          </button>
        </form>
      </div>

      <!-- Lista de Produtos -->
      <div class="bg-white p-4 rounded-xl shadow border border-[#EFE6D8]">
        <h2 class="text-lg font-bold text-[#3D2314] mb-3 flex items-center justify-between">
          <span>Estoque Geral</span>
          <button onclick="carregarProdutos()" class="text-xs bg-[#EFE6D8] px-2 py-1 rounded text-[#3D2314]">Atualizar</button>
        </h2>
        <div id="lista-produtos" class="divide-y divide-[#EFE6D8] text-sm">
          <p class="text-gray-500 py-2 text-center">Buscando...</p>
        </div>
      </div>

    </div>

    <!-- MÓDULO REVENDEDORA -->
    <div id="view-revendedora" class="hidden space-y-6">
      <div class="bg-[#2A180E] text-[#F9F6F0] p-4 rounded-xl shadow border border-[#D4AF37]">
        <p class="text-xs text-[#D4AF37]">Minha Maleta / Consignado</p>
        <h3 class="text-lg font-bold">Comissão Fixa: 30%</h3>
        <p class="text-xs text-gray-300 mt-1">Gere recibos e registre suas vendas direto pelo celular.</p>
      </div>

      <div class="bg-white p-4 rounded-xl shadow border border-[#EFE6D8] space-y-3">
        <h3 class="font-bold text-[#3D2314]">Ações Rápidas</h3>
        <button onclick="gerarReciboSimples()" class="w-full bg-[#D4AF37] hover:bg-[#C5A028] text-[#2A180E] font-bold py-3 px-4 rounded-xl shadow transition-all flex items-center justify-center gap-2">
          <i data-lucide="file-text" class="w-5 h-5"></i>
          Gerar Recibo Simples da Cliente
        </button>
        <button onclick="abrirNFF()" class="w-full bg-[#3D2314] hover:bg-[#2A180E] text-[#F9F6F0] font-bold py-3 px-4 rounded-xl shadow transition-all flex items-center justify-center gap-2 border border-[#D4AF37]">
          <i data-lucide="external-link" class="w-5 h-5 text-[#D4AF37]"></i>
          Emitir Nota Fiscal (NFF)
        </button>
      </div>
    </div>

  </main>

  <script>
    // Insira abaixo a sua chave legacy anon que começa com eyJ...
    const SUPABASE_URL = 'https://wfetysyzdjcfanvtaexb.supabase.co';
    const SUPABASE_KEY = 'COLE_AQUI_A_SUA_CHAVE_EYJ';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (window.lucide) {
      lucide.createIcons();
    }

    function lerCodigoComCamera(event) {
      const file = event.target.files[0];
      if (file) {
        alert("Câmara acionada com sucesso! Digite ou confirme o código da peça no campo SKU.");
      }
    }

    function mudarModo(modo) {
      const prop = document.getElementById('view-proprietaria');
      const rev = document.getElementById('view-revendedora');
      const label = document.getElementById('mod-label');
      const btnP = document.getElementById('btn-prop');
      const btnR = document.getElementById('btn-rev');

      if (modo === 'proprietaria') {
        prop.classList.remove('hidden');
        rev.classList.add('hidden');
        label.innerText = 'Painel Proprietária';
        btnP.className = 'flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#3D2314] text-[#D4AF37] border border-[#D4AF37]';
        btnR.className = 'flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#EFE6D8] text-[#3D2314]';
      } else {
        prop.classList.add('hidden');
        rev.classList.remove('hidden');
        label.innerText = 'App Revendedora';
        btnR.className = 'flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#3D2314] text-[#D4AF37] border border-[#D4AF37]';
        btnP.className = 'flex-1 py-2 px-3 rounded-lg text-sm font-bold bg-[#EFE6D8] text-[#3D2314]';
      }
    }

    async function salvarProduto(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-salvar');
      btn.disabled = true;
      btn.innerText = 'A salvar...';

      const codigo = document.getElementById('prod-codigo').value;
      const nome = document.getElementById('prod-nome').value;
      const custo = parseFloat(document.getElementById('prod-custo').value || 0);
      const venda = parseFloat(document.getElementById('prod-venda').value);
      const estoque = parseInt(document.getElementById('prod-estoque').value);

      const { data, error } = await _supabase.from('produtos').insert([
        { codigo_barras: codigo, nome: nome, preco_custo: custo, preco_venda: venda, estoque_geral: estoque }
      ]);

      if (error) {
        alert('Erro ao salvar produto: ' + error.message);
      } else {
        alert('Produto cadastrado com sucesso!');
        document.getElementById('form-produto').reset();
        carregarProdutos();
      }

      btn.disabled = false;
      btn.innerText = 'Salvar no Banco de Dados';
    }

    async function carregarProdutos() {
      const container = document.getElementById('lista-produtos');
      container.innerHTML = '<p class="text-gray-500 py-2 text-center">Buscando...</p>';

      const { data, error } = await _supabase.from('produtos').select('*').order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p class="text-red-500 py-2 text-center">Erro ao carregar dados: ' + error.message + '</p>';
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-gray-500 py-2 text-center">Nenhum produto cadastrado ainda.</p>';
        return;
      }

      container.innerHTML = data.map(p => `
        <div class="py-2.5 flex justify-between items-center">
          <div>
            <p class="font-bold text-[#3D2314]">${p.nome}</p>
            <p class="text-xs text-gray-500">Cód: ${p.codigo_barras} | Qtd: ${p.estoque_geral}</p>
          </div>
          <span class="font-bold text-[#2A180E]">R$ ${parseFloat(p.preco_venda).toFixed(2)}</span>
        </div>
      `).join('');
    }

    function abrirNFF() {
      window.open("https://www.gov.br/receitafederal/pt-br/assuntos/nota-fiscal-facil-nff", "_blank");
    }

    function gerarReciboSimples() {
      const nome = prompt("Nome da Cliente:", "Maria Silva") || "Cliente";
      const cpf = prompt("CPF da Cliente:", "000.000.000-00") || "";
      const email = prompt("E-mail:", "maria@email.com") || "";
      const whats = prompt("WhatsApp:", "(11) 99999-9999") || "";
      const end = prompt("Endereço de Entrega:", "Rua Exemplo, 123") || "";
      const valor = prompt("Valor Total (R$):", "150,00") || "0,00";

      const win = window.open('', '', 'width=600,height=600');
      win.document.write(`
        <html>
        <head><title>Recibo AGDA Semijoias</title></head>
        <body style="font-family:sans-serif; padding:20px; background:#F9F6F0; color:#2A180E;">
          <div style="background:#fff; border:2px solid #D4AF37; border-radius:12px; padding:24px;">
            <h2 style="text-align:center; color:#3D2314;">AGDA Semijoias - Recibo</h2>
            <hr style="border:0.5px solid #D4AF37; margin-bottom:15px;">
            <p><strong>Cliente:</strong> ${nome}</p>
            <p><strong>CPF:</strong> ${cpf}</p>
            <p><strong>E-mail:</strong> ${email}</p>
            <p><strong>WhatsApp:</strong> ${whats}</p>
            <p><strong>Endereço:</strong> ${end}</p>
            <hr style="border:0.5px solid #EFE6D8; margin:15px 0;">
            <p style="font-size:18px;"><strong>Valor Total:</strong> R$ ${valor}</p>
          </div>
          <script>window.print();<\/script>
        </body>
        </html>
      `);
      win.document.close();
    }

    carregarProdutos();
  </script>
</body>
</html>
